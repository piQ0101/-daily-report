name: daily-push
on:
  schedule:
    - cron: '0 23 * * *'   # 每天 UTC 0:00，即北京时间早上 8:00
  workflow_dispatch:        # 允许你手动点按钮测试

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python main.py
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
