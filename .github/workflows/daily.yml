name: daily-push
on:
  schedule:
    - cron: '30 0,8 * * *'   # 每天 UTC 0:30 和 8:30，即北京时间 8:30 和 16:30
  workflow_dispatch:         # 允许你手动点按钮测试

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python main.py
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
